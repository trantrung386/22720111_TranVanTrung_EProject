name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1️⃣ Clone mã nguồn
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Cài Node.js
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Cài dependencies cho tất cả service
      - name: Install dependencies for all services
        run: |
          set -e
          for d in api-gateway auth product order; do
            if [ -f "$d/package.json" ]; then
              echo "Installing deps for $d"
              (cd $d && npm install)
            fi
          done

      # 4️⃣ Debug để chắc chắn bcryptjs, mocha, chai, chai-http đã có
      - name: Debug installed modules for auth
        run: |
          cd auth
          npm list --depth=0 || true

      # 5️⃣ Chạy test cho AUTH (API + logic)
      - name: Run Auth tests
        env:
          MONGODB_AUTH_URI: mongodb://127.0.0.1:27017/auth_db
          NODE_ENV: test
          JWT_SECRET: idontknow
        run: |
          set -e
          echo "Running tests for auth"
          cd auth
          npm test --silent

      # 6️⃣ Chạy test cho PRODUCT — có khởi động auth server nền để tránh ECONNREFUSED
      - name: Run Product tests (with auth service)
        env:
          MONGODB_PRODUCT_URI: mongodb://127.0.0.1:27017/product_db
          NODE_ENV: test
          JWT_SECRET: idontknow
        run: |
          set -e
          echo "Starting auth service in background..."
          cd auth && npm start &

          echo "Waiting 10 seconds for auth service to start..."
          sleep 10

          echo "Running product tests..."
          cd ../product
          npm test --silent

  build-and-push:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      # 1️⃣ Clone mã nguồn
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Đăng nhập Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3️⃣ Build & push image cho từng service
      - name: Build and push Docker images
        run: |
          set -e
          for d in api-gateway auth product order; do
            if [ -f "$d/Dockerfile" ]; then
              IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/$d:${{ github.sha }}
              echo "Building and pushing $IMAGE_NAME"
              docker build -t $IMAGE_NAME $d
              docker push $IMAGE_NAME
            fi
          done
