name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install dependencies for all services
      - name: Install dependencies for all services
        run: |
          set -e
          for d in api-gateway auth product order; do
            if [ -f "$d/package.json" ]; then
              echo "Installing deps for $d"
              (cd $d && npm install)
            fi
          done

      # 4️⃣ Debug modules
      - name: Debug installed modules for auth
        run: |
          cd auth
          npm list --depth=0 || true

      # 5️⃣ Run Auth tests
      - name: Run Auth tests
        env:
          MONGODB_AUTH_URI: mongodb://127.0.0.1:27017/auth_db
          NODE_ENV: test
          JWT_SECRET: idontknow
        run: |
          set -e
          echo "Running tests for auth"
          cd auth
          npm test --silent
          cd ..

      # 6️⃣ Run Product tests (start Auth first)
      - name: Run Product tests (with auth service)
        env:
          MONGODB_AUTH_URI: mongodb://127.0.0.1:27017/auth_db
          MONGODB_PRODUCT_URI: mongodb://127.0.0.1:27017/product_db
          NODE_ENV: test
          JWT_SECRET: idontknow
        run: |
          set -e
          echo "Starting auth service in background..."
          cd auth
          MONGODB_AUTH_URI=mongodb://127.0.0.1:27017/auth_db npm start &
          sleep 10
          cd ../product
          echo "Running product tests..."
          npm test --silent

  build-and-push:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Debug secrets (để chắc chắn secrets có tồn tại)
      - name: Debug secrets (safe check)
        run: |
          echo "Docker username set? ${{ secrets.DOCKERHUB_USERNAME != '' }}"
          echo "Docker token set? ${{ secrets.DOCKERHUB_TOKEN != '' }}"

      # 3️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # 4️⃣ Build and push Docker images
      - name: Build and push Docker images
        run: |
          set -e
          for d in api-gateway auth product order; do
            if [ -f "$d/Dockerfile" ]; then
              IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/$d:latest
              echo "🐳 Building and pushing $IMAGE_NAME ..."
              docker build -t $IMAGE_NAME $d
              docker push $IMAGE_NAME
              echo "✅ Successfully pushed $IMAGE_NAME"
            fi
          done
